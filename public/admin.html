<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin | THE ONE Bakery</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="THE ONE Bakery">

        </div>

        <h2>

            THE ONE Bakery

        </h2>

        <nav>

            <a
                href="admin.html"
                class="active">

                📋 จัดการออเดอร์

            </a>

            <a
                href="dashboard.html">

                📊 ภาพรวมระบบ

            </a>

            <a
                href="kitchen.html">

                👨‍🍳 รายการทำขนม

            </a>

            <a
                href="packing.html">

                📦 จัดแพ็คของ
            </a>

            <a href="products.html">
                🍞 จัดการสินค้า
            </a>
        </nav>

    </aside>

    <!-- Main -->

    <main class="content">

        <header class="page-header">

            <h1>

                จัดการออเดอร์

            </h1>

            <p>

                แสดงรายการออเดอร์ตามวันที่ และสามารถเปลี่ยนสถานะได้

            </p>

        </header>

        <!-- เลือกวันที่ -->

        <div class="toolbar">

            <label for="orderDate">

                📅 วันที่

            </label>

            <input

                type="date"

                id="orderDate"

                onchange="loadOrdersByDate()">

        </div>

        <!-- Orders -->

        <div

            id="orders"

            class="orders">

        </div>

    </main>

</div>

<script src="js/admin.js"></script>

</body>

</html>
