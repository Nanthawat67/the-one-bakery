<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>THE ONE Bakery</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/customer.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="customer-header">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="THE ONE Bakery">

        </div>

        <h1>

            THE ONE Bakery

        </h1>

    </header>

    <!-- Search -->

    <section class="search-section">

        <input

            type="text"

            id="search"

            placeholder="🔍 ค้นหาสินค้า..."

            onkeyup="searchProduct()">

    </section>

    <!-- Product List -->

    <section>

        <h2 class="section-title">

            เมนูทั้งหมด

        </h2>

        <div

            id="products"

            class="products">

        </div>

    </section>

</div>

<!-- Floating Cart -->

<button

    class="cart-button"

    onclick="goCart()">

    🛒

    <span id="cartCount">

        0

    </span>

    รายการ

</button>

<script src="js/app.js"></script>

</body>

</html>
