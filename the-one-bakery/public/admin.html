<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Admin - THE ONE Bakery
</title>


<link rel="stylesheet" href="css/style.css">

</head>


<body>



<header class="header">


<h1>
👨‍🍳 THE ONE Bakery Admin
</h1>


<p>
ระบบจัดการคำสั่งซื้อ
</p>


</header>




<main>

<main class="admin-layout">

  <aside class="sidebar">

    <h2>เมนู</h2>

    <button>📊 Dashboard</button>

    <button>📦 Orders</button>

    <button>🍞 Products</button>

  </aside>


  <section class="content">

    <div class="stats">

      <div class="stat-card">
        <h3>📦 ออเดอร์ทั้งหมด</h3>
        <p id="totalOrders">0</p>
      </div>

      <div class="stat-card">
        <h3>💰 ยอดขายทั้งหมด</h3>
        <p id="totalSales">0 บาท</p>
      </div>

    </div>

    <div class="stats">

    <div class="stat-card">

        <h3>📦 ออเดอร์ทั้งหมด</h3>

        <h1 id="totalOrders">0</h1>

    </div>


    <div class="stat-card">

        <h3>💰 ยอดขาย</h3>

        <h1 id="totalSales">0 บาท</h1>

    </div>


    <div class="stat-card">

        <h3>🥖 จำนวนสินค้าที่ขาย</h3>

        <h1 id="totalItems">0</h1>

    </div>


    <div class="stat-card">

        <h3>⭐ สินค้าขายดี</h3>

        <h1 id="bestProduct">-</h1>

    </div>

</div>

    <div class="dashboard-card">

      <h2>
        📦 รายการออเดอร์
      </h2>

      <table class="order-table">

        <thead>

          <tr>
            <th>Order</th>
            <th>ลูกค้า</th>
            <th>รายการ</th>
            <th>ยอดรวม</th>
            <th>รับสินค้า</th>
            <th>สถานะ</th>
          </tr>

        </thead>

        <tbody id="orders">

        </tbody>

      </table>

    </div>

  </section>

</main>


<footer>

<p>
© THE ONE Bakery
</p>

</footer>



<script src="js/admin.js"></script>


</body>

</html>
